name: yuantanzhang-personal
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: personal
      POSTGRES_PASSWORD: personal_local
      POSTGRES_DB: ytz_personal
    ports:
      - '127.0.0.1:5547:5432'
    volumes:
      - personal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U personal -d ytz_personal']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6397:6379'
    volumes:
      - personal-redis:/data
volumes:
  personal-postgres:
  personal-redis:
