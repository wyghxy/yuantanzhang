<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>元探长</title>
  <style>
    :root{color-scheme:light dark;--bg:#f4f6f8;--panel:#fff;--text:#202932;--muted:#687681;--border:#e0e6eb;--accent:#1766cf}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}main{max-width:940px;margin:0 auto;padding:70px 28px 40px}.brand{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700}.brand img{width:38px;height:38px;border-radius:10px}h1{font-size:36px;line-height:1.4;letter-spacing:-1px;margin:46px 0 8px}.intro{color:var(--muted);margin:0 0 30px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:20px}.choice{padding:30px;background:var(--panel);border:1px solid var(--border);border-radius:18px;display:flex;flex-direction:column;min-height:260px}.tag{color:var(--accent);font-size:12px;font-weight:600}h2{font-size:24px;margin:10px 0}.choice p{color:var(--muted);margin:0 0 24px}.button{align-self:flex-start;margin-top:auto;padding:10px 20px;background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:9px;text-decoration:none;font-weight:600}.button.secondary{background:transparent;color:var(--accent);border-color:var(--border)}.note{display:block;color:var(--muted);font-size:12px;margin-top:12px}footer{display:flex;gap:22px;flex-wrap:wrap;margin-top:26px;font-size:13px;color:var(--muted)}footer a{color:inherit;text-underline-offset:3px}a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}@media(max-width:640px){main{padding:32px 20px}.choices{grid-template-columns:1fr}h1{font-size:28px;margin-top:32px}.choice{padding:24px;min-height:240px}}@media(prefers-color-scheme:dark){:root{--bg:#15191d;--panel:#1d2329;--text:#edf0f3;--muted:#9ca9b4;--border:#343f48;--accent:#7cb4ff}.button{background:#236bc4;color:#fff;border-color:#236bc4}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="apps/web/public/demo/brand-mark.svg" alt="">元探长</div>
    <h1>选一种方式，开始创作。</h1>
    <p class="intro">使用自己的本机工作台，或直接进入官方在线版。</p>
    <div class="choices">
      <section class="choice" aria-labelledby="personal-title">
        <span class="tag">本机运行</span><h2 id="personal-title">个人版</h2>
        <p>默认免登录，稿件与素材保存在自己的电脑。需要先在本机安装并启动项目。</p>
        <a class="button secondary" href="http://127.0.0.1:3310/workspace/viral">打开本机个人版</a>
        <small class="note">首次运行方式见下载包中的 README.md。</small>
      </section>
      <section class="choice" aria-labelledby="official-title">
        <span class="tag">无需本地部署</span><h2 id="official-title">官方在线版</h2>
        <p>由元探长提供在线工作台和服务，直接在浏览器中使用。</p>
        <a class="button" href="https://yuantanzhang.cn/workspace/viral">立即使用官方在线版 ↗</a>
        <small class="note">在线版使用网站账号，服务与使用条件以官网为准。</small>
      </section>
    </div>
    <footer><a href="https://yuantanzhang.cn/">元探长官网</a><a href="https://github.com/wyghxy/yuantanzhang">GitHub 开源仓库</a><span>Copyright © 2026 元探长</span></footer>
  </main>
</body>
</html>
