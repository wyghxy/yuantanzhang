name: Personal edition checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  install-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup
      - run: pnpm exec tsx apps/worker/src/main.ts --once
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm check:release
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Local HTTP and browser acceptance
        run: |
          node apps/api/dist/main.js > /tmp/personal-api.log 2>&1 &
          service_pid=$!
          node apps/worker/dist/main.js > /tmp/personal-worker.log 2>&1 &
          worker_pid=$!
          pnpm --filter @ytz/web exec next start -H 127.0.0.1 -p 3310 > /tmp/personal-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$service_pid" "$worker_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3311/api/health > /dev/null; then break; fi
            sleep 1
          done
          pnpm test:integration
          pnpm test:demo
          VERIFY_PERSONAL_WORKER=1 pnpm test:backend-workflows
          pnpm test:browser
